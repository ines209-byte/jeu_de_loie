<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateau — Le Jardin des Oies</title>
<style>
:root{--ink:#352344;--line:#f4b8d5}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:linear-gradient(135deg,#ffe3f1 0%,#fff5fb 48%,#e8e2ff 100%);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{text-align:center;padding:16px;margin:0 auto 18px;max-width:1100px;background:linear-gradient(90deg,#ffc6e0,#fff7fb,#d9d0ff);border:2px solid #ff86bd;border-radius:16px}
h1{margin:0;color:#a21caf;font-size:clamp(1.5rem,4vw,2.4rem)}
p{margin:6px 0 0}
main{max-width:1100px;margin:auto;background:#fffef8;border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px #5d4a2510}
#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.cell{min-width:0;min-height:78px;border:1px solid #dfd2b2;border-radius:9px;background:#ffe0ef;padding:5px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.cell:nth-child(4n){background:#d8f8f0}
.cell.special{background:#e5d9ff}
.cell.start{background:#a7f3d0}
.cell.finish{background:#ffc6df;border:2px solid #ec4899}
.num{align-self:flex-start;font-size:.78rem;font-weight:850}
.symbol{font-size:clamp(1rem,2.2vw,1.6rem);line-height:1.1}
.name{font-size:.68rem;font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.legend span{padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:.85rem}
@media(max-width:650px){body{padding:7px}main{padding:6px}#board{gap:2px}.cell{min-height:53px;padding:2px;border-radius:5px}.num{font-size:.62rem}.name{font-size:.52rem}.symbol{font-size:.95rem}.legend span{font-size:.75rem;padding:4px 6px}}
@media print{body{background:white;padding:0}header,main{box-shadow:none}main{border:1px solid #999}#board{gap:3px}.cell{min-height:65px;break-inside:avoid}}
</style>
</head>
<body>
<header>
<h1>Le Jardin des Oies</h1>
<p>Plateau de jeu — 63 cases</p>
</header>
<main>
<div id="board" aria-label="Plateau de 63 cases"></div>
<div class="legend">
<span>Départ : case 1</span><span>Oies : 9, 18, 27, 36, 45, 54</span>
<span>Pont : 6</span><span>Hôtel : 19</span><span>Puits : 31</span>
<span>Labyrinthe : 42</span><span>Prison : 52</span><span>Tête de mort : 58</span><span>Arrivée : 63</span>
</div>
</main>
<script>
const special={6:["🌉","Pont"],9:["🪿","Oie"],18:["🪿","Oie"],19:["🏨","Hôtel"],27:["🪿","Oie"],31:["🕳️","Puits"],36:["🪿","Oie"],42:["🌀","Labyrinthe"],45:["🪿","Oie"],52:["🔒","Prison"],54:["🪿","Oie"],58:["💀","Tête de mort"],63:["🏁","Arrivée"]};
const board=document.getElementById("board");
function pos(n){const r=Math.floor((n-1)/9),o=(n-1)%9;return{row:7-r,col:r%2===0?o:8-o}}
for(let n=1;n<=63;n++){
 const c=document.createElement("div"),num=document.createElement("span"),sym=document.createElement("span"),name=document.createElement("span"),q=pos(n);
 c.className="cell"+(special[n]?" special":"")+(n===1?" start":"")+(n===63?" finish":"");
 c.style.gridRow=q.row+1;c.style.gridColumn=q.col+1;
 num.className="num";num.textContent=n;
 sym.className="symbol";sym.textContent=special[n]?.[0]||(n===1?"🚩":"");
 name.className="name";name.textContent=special[n]?.[1]||(n===1?"Départ":"");
 c.append(num,sym,name);board.append(c);
}
</script>
</body>
</html>
